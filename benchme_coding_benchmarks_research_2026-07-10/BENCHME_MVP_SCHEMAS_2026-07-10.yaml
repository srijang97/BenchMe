bundle:
  name: BenchMe MVP schema bundle
  version: 0.1.0
  research_date: '2026-07-10'
  status: implementation-ready draft; examples, not a published compatibility promise
  primary_unit: model-harness-context-tools-permissions-budget-environment-verifier-trial configuration
  source_report: BENCHME_CODING_BENCHMARKS_RESEARCH_DOSSIER_2026-07-10.md
evaluation_doctrine:
  tracks_must_remain_separate:
  - id: native_product
    question: What does a buyer get from the product under a declared normal configuration?
    allowed_variation:
    - native prompt/context policy
    - native tools
    - native edit/recovery protocol
    valid_claim: Configuration A outperformed B under these native-product conditions.
  - id: fixed_harness_model
    question: Which model performs best inside one pinned harness and tool contract?
    allowed_variation:
    - model/provider
    - strictly required model adapter or chat template
    valid_claim: Within harness H version V, model M1 outperformed M2.
  - id: controlled_intervention
    question: What is the effect of one named prompt/context/tool/recovery intervention?
    allowed_variation:
    - one preregistered intervention
    valid_claim: Intervention I changed outcomes under configuration C.
  - id: augmentation
    question: Does a BenchMe-supplied context or tool layer improve a declared baseline?
    allowed_variation:
    - versioned BenchMe context pack
    - versioned BenchMe tools
    valid_claim: BenchMe augmentation improved or degraded baseline C.
  - id: live_outcome
    question: Do offline predictions transfer to accepted changes and real review/CI outcomes?
    allowed_variation:
    - deployment policy as preregistered
    valid_claim: The deployed policy changed measured outcomes under the pilot design.
  never_collapse_into_one_score:
  - verified task success
  - consistency
  - wall time
  - cost
  - regressions
  - policy violations
  - diff risk
  - human review burden
  - operational failure rate
  minimum_controls:
  - base negative control
  - reference positive control
  - regression suite
  - no-op or adversarial negative where practical
  - alternate-solution positive where practical
task_capsule:
  schema_version: benchme.task_capsule.v0.1
  required_fields:
  - capsule_id
  - capsule_version
  - provenance
  - repository
  - task
  - environment_ref
  - agent_visible
  - oracle
  - controls
  - information_policy
  - risk
  - validation
  - artifact_hashes
  example:
    capsule_id: itsdangerous-fallback-salts-001
    capsule_version: 2
    status: validated
    provenance:
      kind: fresh_unpublished_task_on_public_repo
      source_url: null
      authored_at: '2026-07-09T00:00:00Z'
      temporal_cutoff: '2026-07-09T00:00:00Z'
      authoring_method: human_authored
      solution_shape_reviewed_for_leakage: true
      notes:
      - Public repository familiarity remains possible; exact task and patch were not public.
    repository:
      display_id: pallets/itsdangerous
      base_sha: 672971d66a2ef9f85151e53283113f33d642dabd
      source_archive_sha256: <sha256>
      license: <SPDX identifier>
      history_isolation: git_archive_then_single_commit_reinit
      nested_git_scan: passed
    task:
      type: feature_implementation
      language: python
      statement_path: task.md
      statement_sha256: <sha256>
      requirements:
      - id: R1
        text: Serializer accepts fallback_salts.
      - id: R2
        text: Signing continues to use only the primary salt.
      - id: R3
        text: Loading tries primary salt followed by fallbacks.
      - id: R4
        text: Unsafe timed loading preserves its backward-compatible tuple contract.
      allowed_paths:
      - src/**
      - docs/**
      - tests/**
      forbidden_paths:
      - .github/**
      - .benchme/private/**
      maximum_changed_files: 8
      known_ambiguities: []
    environment_ref: env-itsdangerous-py312-v1
    agent_visible:
      files:
      - repository checkout
      - task.md
      - upstream tests
      tests:
      - upstream tests
      hidden_from_agent:
      - private verifier
      - reference implementation
      - post-task reviewer notes
    oracle:
      assurance_level: O3
      verifier_ref: verifier-fallback-salts-v2
      target_tests:
      - private_tests/test_fallback_salts.py
      regression_commands:
      - pytest -q
      static_commands:
      - mypy src
      - pyright
      - ruff check .
      security_commands: []
      require_human_review: true
      require_clean_evaluation_environment: true
      test_requirement_map:
      - requirement_id: R1
        tests:
        - test_constructor_accepts_fallback_salts
      - requirement_id: R4
        tests:
        - test_unsafe_timed_load_contract
    controls:
      base_negative:
        expected_target_failures: 9
        expected_regression_passes: 297
        status: passed
      reference_positive:
        reference_kind: evaluator_authored
        patch_sha256: <sha256>
        expected_target_passes: 9
        expected_regression_passes: 297
        status: passed
      noop_negative:
        required: true
        status: passed
      near_miss_negatives:
      - id: sign_with_fallback_salt
        expected: fail
        status: passed
      - id: break_unsafe_contract
        expected: fail
        status: passed
      alternate_solution_positive:
        required: false
        status: not_run
    information_policy:
      web: deny
      remote_git: deny
      future_git_objects: absent
      package_registry: setup_only_allowlisted_or_offline
      issue_tracker: deny
      hidden_tests_during_inference: absent
      outbound_ledger_required: true
    risk:
      class: medium
      blast_radius: library compatibility
      verifiability: high_but_not_complete
      sensitive_areas:
      - token signing
      - backward compatibility
      human_review_dimensions:
      - scope
      - compatibility
      - maintainability
      - security semantics
    validation:
      reviewers: 1
      review_status: approved
      validated_at: '2026-07-09T00:00:00Z'
      environment_preflight: passed
      oracle_red_team: passed
      flakiness_trials: 3
      flakiness_observed: false
    artifact_hashes:
      capsule_manifest_sha256: <sha256>
      task_statement_sha256: <sha256>
      verifier_bundle_sha256: <sha256>
      reference_patch_sha256: <sha256>
environment_manifest:
  schema_version: benchme.environment.v0.1
  example:
    environment_id: env-itsdangerous-py312-v1
    platform:
      os: linux
      architecture: x86_64
      container_runtime: docker
      image: ghcr.io/benchme/python-runner@sha256:<digest>
      kernel_class: containerized
    toolchain:
      python: 3.12.4
      uv: 0.7.0
      git: 2.45.2
      pytest: 8.4.0
      mypy: 1.16.0
      pyright: 1.1.405
      ruff: 0.12.0
    dependency_state:
      lockfiles:
      - path: uv.lock
        sha256: <sha256>
      package_source: offline_mirror
      package_source_snapshot: '2026-07-09'
      install_network: deny
    resources:
      cpu_limit: 4
      memory_mb: 8192
      disk_mb: 20480
      process_limit: 512
      wall_clock_seconds: 1800
    services: []
    locale:
      timezone: UTC
      locale: C.UTF-8
    security:
      user: benchme
      root: deny
      host_mounts:
      - workspace_rw
      - artifacts_rw
      hidden_verifier_during_inference: absent
      seccomp_profile_sha256: <sha256>
      outbound_policy_ref: sealed-v1
      secret_sources: none
    preflight:
    - id: workspace_write
      command: python -c "from pathlib import Path; Path('preflight.tmp').write_text('ok')"
      expected: exit_0
    - id: baseline_tests
      command: pytest -q
      expected: exit_0
    - id: network_denied
      command: python .benchme/probes/network_probe.py
      expected: denied
    - id: hidden_tests_absent
      command: test ! -e /verifier/private_tests
      expected: exit_0
native_capability_manifest:
  schema_version: benchme.capabilities.v0.1
  fact_fields:
  - default_state
  - configurable
  - observable
  - evidence
  - version_range
  - checked_at
  - benchmark_treatment
  example:
    manifest_id: aider-capabilities-<version>-2026-07-10
    harness:
      name: aider
      version: <exact-version>
      binary_sha256: <sha256>
    checked_at: '2026-07-10'
    capabilities:
      repo_map:
        default_state: enabled_conditionally
        configurable: true
        observable: partial
        evidence:
        - type: official_docs
          url: https://aider.chat/docs/repomap.html
        - type: local_probe
          probe_sha: <git-sha>
        benchmark_treatment:
          native_product: preserve
          fixed_harness_model: fix_parameters
          augmentation: report_native_plus_external
      edit_format:
        default_state: model_specific
        configurable: true
        observable: true
        evidence:
        - type: official_docs
          url: https://aider.chat/docs/more/edit-formats.html
        benchmark_treatment:
          native_product: preserve_recommended
          fixed_harness_model: declare_required_adapter
      test_repair_loop:
        default_state: disabled
        configurable: true
        observable: true
        evidence:
        - type: official_docs
          url: https://aider.chat/docs/usage/lint-test.html
        benchmark_treatment:
          native_product: declare_actual
          controlled_intervention: toggle_as_named_factor
    unknowns:
    - exact native context truncation under provider X

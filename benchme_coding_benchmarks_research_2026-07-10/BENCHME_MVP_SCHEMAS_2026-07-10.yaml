minimum_cli:
  commands:
    benchme doctor: Probe host/container/network/tool availability without touching a task.
    benchme capabilities probe <adapter>: Generate or verify a native capability manifest.
    benchme capsule init: Create a capsule skeleton.
    benchme capsule validate <capsule>: Run base/reference/no-op controls, leakage checks, and flakiness checks.
    benchme plan <experiment.yaml>: Expand the declared design into immutable run manifests.
    benchme run <plan>: Execute isolated runs and persist raw artifacts.
    benchme verify <run>: Evaluate a patch in a clean verifier environment.
    benchme review <run>: Open the blinded human-review workflow.
    benchme analyze <experiment>: Compute paired results, intervals, Pareto views, and failure decomposition.
    benchme report <experiment>: Generate Markdown/HTML/JSON decision artifacts.
    benchme reproduce <run_id>: Rebuild environment and replay from immutable manifests.
minimum_report:
  sections:
  - decision question and scope
  - task-set validity and exclusions
  - configuration cards
  - native-product results
  - fixed-harness or intervention results kept separate
  - verified success with uncertainty
  - operational reliability
  - cost attribution tier
  - failure taxonomy
  - human review findings
  - Pareto and task/risk segmentation
  - recommended action
  - what remains unproven
  - machine-readable appendix
  prohibited_claims_without_extra_evidence:
  - base model superiority across harnesses
  - organizational productivity improvement
  - production safety from test pass alone
  - enterprise-wide cost per accepted change from estimated tokens
  - neutrality when native features were disabled or augmented silently
minimum_data_model:
  entities:
  - repository
  - capsule
  - capsule_version
  - environment
  - capability_manifest
  - configuration
  - experiment
  - run
  - event
  - artifact
  - verification
  - human_review
  - metric
  - failure
  - decision_report
  - live_change_later
  - policy_later
  join_key: immutable configuration manifest plus capsule version plus trial
  source_of_truth: local SQLite metadata and content-addressed JSON/JSONL artifacts
  optional_exports:
  - OpenTelemetry
  - Langfuse
  - LangSmith
  - Phoenix

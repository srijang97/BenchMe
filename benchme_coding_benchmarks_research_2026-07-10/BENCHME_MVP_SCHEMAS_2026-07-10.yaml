context_pack:
  schema_version: benchme.context_pack.v0.1
  rule: A context pack is an experimental intervention and must never be silently treated as native agent performance.
  example:
    context_pack_id: itsdangerous-symbol-pack-v1
    generator:
      name: benchme-context
      version: <git-sha>
      deterministic: true
    retrieval_methods:
    - ripgrep
    - tree_sitter_symbols
    - dependency_edges
    excluded_methods:
    - web_search
    - future_git_history
    - gold_patch_similarity
    included_items:
    - path: src/itsdangerous/serializer.py
      span: Serializer.__init__, dumps, loads
      reason: task contract symbols
    - path: src/itsdangerous/timed.py
      span: TimedSerializer.loads
      reason: inheritance behavior
    token_count: 4200
    sha256: <sha256>
    leakage_review:
      reviewer: <id>
      status: approved
      notes: []
experiment_plan:
  schema_version: benchme.experiment.v0.1
  example:
    experiment_id: public-python-native-v1
    decision_question: Which of two native coding products is more reliable and economical for small Python maintenance
      tasks?
    preregistered_at: '2026-07-10T00:00:00Z'
    task_set:
      capsules:
      - task-001
      - task-002
      inclusion_rule: validated_O2_or_higher
      task_count_target: 10
    tracks:
    - id: native_product
      configurations:
      - claude-code-<model>-native
      - codex-cli-<model>-native
      fixed:
      - task capsule
      - environment
      - verifier
      - information policy
      - wall-clock cap
    - id: fixed_codex_model
      configurations:
      - codex-gpt55
      - codex-gpt54
      - codex-gpt54-mini
      fixed:
      - harness version
      - prompt
      - tools
      - permissions
      - environment
      - verifier
      - reasoning effort
    - id: context_intervention
      baseline: codex-gpt54-native
      interventions:
      - standardized_task_contract
      - frozen_context_pack
      - frozen_context_pack_plus_one_repair
    primary_metrics:
    - verified_solve
    - regression_free_solve
    - operational_success
    secondary_metrics:
    - wall_seconds
    - cost_per_verified_solve
    - tool_calls
    - test_attempts
    - diff_surface
    - human_review_rubric
    analysis:
      paired_by_task: true
      minimum_trials_per_cell: 3
      confidence_interval: task_cluster_bootstrap
      near_tie_rule: do_not_rank_when_interval_or paired_test_cannot_support_ordering
      sequential_elimination: true
      multiple_comparison_policy: declare exploratory unless preregistered
    failure_handling:
      invalid_preflight: exclude_from_capability_view_and_include_in runner_quality_report
      provider_transient: one controlled rerun; retain original event
      timeout: count as unsolved and report censored cost/time
      agent_error: count as configuration failure
      verifier_error: invalidate run; quarantine task if systemic

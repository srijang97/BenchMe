human_review:
  schema_version: benchme.human_review.v0.1
  dimensions:
  - id: spec_alignment
    scale: 0-2
  - id: backward_compatibility
    scale: 0-2
  - id: scope_discipline
    scale: 0-2
  - id: maintainability
    scale: 0-2
  - id: security_semantics
    scale: 0-2_or_not_applicable
  - id: test_quality
    scale: 0-2_or_not_applicable
  example:
    run_id: <uuid>
    reviewer_id: <pseudonymous-id>
    blinded_to_configuration: true
    rubric_version: engineering-review-v1
    scores:
      spec_alignment: 2
      backward_compatibility: 2
      scope_discipline: 1
      maintainability: 2
      security_semantics: 2
      test_quality: not_applicable
    blocking_findings: []
    non_blocking_findings:
    - Unnecessary comment duplication
    production_acceptable_for_task: true
    review_minutes: 12.5
    review_artifact_sha256: <sha256>
failure_taxonomy:
  schema_version: benchme.failure_taxonomy.v0.1
  classes:
    invalid_experiment:
    - task_ambiguous
    - task_unsolvable
    - oracle_vacuous
    - oracle_overconstrained
    - reference_invalid
    - hidden_test_leak
    - future_history_present
    - unsupported_configuration_change
    environment_or_infrastructure:
    - workspace_read_only
    - dependency_setup_failure
    - service_unavailable
    - container_failure
    - disk_or_memory_exhaustion
    - runner_bug
    - network_policy_misconfiguration
    provider_or_transport:
    - rate_limit
    - provider_5xx
    - authentication_failure
    - stream_interrupted
    - model_unavailable
    harness:
    - startup_failure
    - tool_schema_failure
    - patch_extraction_failure
    - unsupported_cli_version
    - permission_deadlock
    agent_behavior:
    - localization_failure
    - incorrect_hypothesis
    - invalid_edit
    - test_avoidance
    - destructive_change
    - looping
    - premature_stop
    - context_loss
    - reward_hacking_attempt
    - answer_retrieval_attempt
    verification:
    - target_test_fail
    - regression
    - static_failure
    - policy_violation
    - timeout
    - human_review_reject
  reporting_views:
    scientific_capability: Exclude only preregistered invalid-experiment/infrastructure cases; never silently erase
      harness or agent failures.
    operational_reliability: Count every deployment-relevant failure from experiment start through verified output.
    runner_quality: Track invalid environment and adapter failures separately as BenchMe defects/SLOs.
